name: Linux installer

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - run: npm run check:protocol
      - run: npm run check:view
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build console companion
        run: |
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin ninja-desk-cli
          mkdir -p src-tauri/binaries
          cp src-tauri/target/release/ninja-desk-cli src-tauri/binaries/ninja-desk-cli-x86_64-unknown-linux-gnu
      - run: npm run tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ninja-desk-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
