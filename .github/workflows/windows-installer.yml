name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Build console companion
        run: |
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin ninja-desk-cli
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item src-tauri/target/release/ninja-desk-cli.exe src-tauri/binaries/ninja-desk-cli-x86_64-pc-windows-msvc.exe
      - run: npm run tauri build -- --config src-tauri/tauri.bundle.conf.json --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ninja-desk-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
