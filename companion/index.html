<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ninja Desk</title>
    <link id="favicon" rel="icon" type="image/svg+xml" />
    <script type="module" src="/main.ts" defer></script>
  </head>
  <body>
    <main class="companion-layout">
      <header class="companion-header">
        <div class="brand"><img id="brand-mark" alt="" width="36" height="36" /><h1 data-fit>Ninja Desk</h1></div>
        <span id="status" data-fit role="status">Enter the access password</span>
      </header>
      <form id="connect-form" class="connect-form">
        <label for="password" data-fit>Access password</label>
        <div class="connect-row">
          <input id="password" type="password" autocomplete="off" spellcheck="false" required minlength="64" maxlength="64" />
          <button type="submit" data-fit>Connect</button>
        </div>
      </form>
      <section id="session" hidden>
        <div class="session-bar">
          <strong data-fit>Windows desktop</strong>
          <button id="disconnect" type="button" data-fit>Disconnect</button>
        </div>
        <div class="screen-wrap" id="screen-wrap" aria-label="Remote desktop touch area">
          <video id="screen" autoplay playsinline muted aria-label="Windows desktop"></video>
        </div>
        <div class="session-toolbar" aria-label="Remote controls">
          <button id="mode" type="button" data-fit data-mode="mouse" aria-label="Input mode: mouse">Mouse mode</button>
          <button id="right-click" type="button" data-fit>Right click</button>
          <button id="scroll-up" type="button" aria-label="Scroll up" title="Scroll up">↑</button>
          <button id="scroll-down" type="button" aria-label="Scroll down" title="Scroll down">↓</button>
          <button id="display-options" type="button" data-fit aria-expanded="false" aria-controls="view-options">Display</button>
          <button id="clipboard-toggle" type="button" data-fit aria-expanded="false" aria-controls="clipboard">Clipboard</button>
        </div>
        <div id="view-options" class="view-options" hidden>
          <span data-fit>View</span>
          <button id="fit-view" type="button" data-fit>Fit</button>
          <button id="actual-view" type="button" data-fit>Actual size</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <output id="zoom-level" aria-live="polite">100%</output>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="reset-view" type="button" data-fit>Reset view</button>
          <p class="gesture-help">Mouse mode: drag a finger to move the pointer, tap to click. Touch mode: tap or drag directly. Double tap and hold to drag in mouse mode. Two fingers tap for right click; pinch to zoom; three fingers drag to scroll.</p>
        </div>
        <section id="clipboard" class="clipboard" aria-labelledby="clipboard-heading" hidden>
          <h2 id="clipboard-heading" data-fit>Clipboard</h2>
          <label for="remote-text" data-fit>Copied on laptop</label>
          <textarea id="remote-text" readonly rows="3"></textarea>
          <button id="copy-remote" type="button" data-fit>Copy to this device</button>
          <label for="local-text" data-fit>Send to laptop</label>
          <textarea id="local-text" rows="3" placeholder="Paste or type text here"></textarea>
          <div class="clipboard-actions">
            <button id="paste-local" type="button" data-fit>Paste from this device</button>
            <button id="send-local" type="button" data-fit>Send to laptop</button>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
