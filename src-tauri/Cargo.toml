[package]
name = "ninja-desk"
version = "0.1.3"
description = "Local desktop host for a browser controller"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ninja_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
enigo = "0.6.1"
hex = "0.4.3"
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rand = "0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.2.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.8"

[target.'cfg(target_os = "linux")'.dependencies]
tiny_http = "0.12"
screenshots = "0.8.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
