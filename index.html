<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Ninja Desk</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="host-layout">
      <header class="host-header">
        <h1 data-fit>Ninja Desk</h1>
        <span id="status" data-fit role="status">Starting…</span>
      </header>
      <section aria-labelledby="password-heading">
        <h2 id="password-heading" data-fit>Access password</h2>
        <div class="password-row">
          <input id="password" aria-label="Access password" type="password" readonly spellcheck="false" />
          <button id="reveal" type="button" data-fit>Show</button>
          <button id="copy" type="button" data-fit>Copy</button>
        </div>
        <p data-fit>Enter this password in the browser companion. It stays on this Windows account.</p>
      </section>
      <div class="host-actions">
        <button id="stop" type="button" class="danger" data-fit>Stop remote access</button>
        <button id="replace-password" type="button" data-fit>Replace password</button>
      </div>
      <canvas id="screen" width="1280" height="720" hidden></canvas>
    </main>
  </body>
</html>
